developments:
- startingState: Insecure analyst living in Zen’s shadow and avoiding confrontation.
  pressurePoint: Bullies take a meaningful card; he withdraws from class and hides in his room.
  revelation: Finn’s Best of 3 challenge forces a first step toward action.
  endState: Returns to class and becomes Finn’s friend without instantly becoming confident.
