narrative:
- heading: Chapter development
  text: 'Three students take a meaningful card after defeating Sirius. Finn intervenes. Sirius later hides in his
    room after missing class, and Finn forces him to act through a Best of 3 duel. He returns to class and becomes
    Finn''s friend without becoming confident overnight.


    Long-term development: a Chapter 2 growth spurt makes him taller than Finn while his internal identity remains
    small. Later he becomes a better duelist and values theory, construction and analysis without measuring himself
    against Zen.'
chapter: 'Chapter 1: one adult university year, approximately September–June; arc ordering remains provisional.'
