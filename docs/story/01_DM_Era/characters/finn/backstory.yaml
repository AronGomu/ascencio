narrative:
- heading: Backstory
  text: Finn has ordinary middle-class origins and ordinary schooling. His parents once forced him to study something
    else and forbade dueling for one or two months because duelists were poorly regarded. He concluded that he should
    never again do anything except what he feels like doing.
