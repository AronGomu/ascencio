<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Deck Select Layout (duel-start) v3 · Twin Columns</title>
<style>
  @font-face {
    font-family: "Forum";
    src: url("../public/fonts/forum-latin.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("../public/fonts/source-serif-4-latin.woff2") format("woff2");
    font-weight: 400 700; font-style: normal; font-display: swap;
  }

  /* Basilica Slate tokens — subset of src/styles/tokens.css */
  :root {
    --bg: #08101f;
    --surface: #111b2f;
    --surface-raised: #18243b;
    --surface-panel: #101a2d;
    --surface-chain: #0d1729;
    --border: #697895;
    --text: #eef1f7;
    --muted: #a9b5ca;
    --ink-on-accent: #14100a;
    --accent: #d3b268;
    --accent-strong: #c19a45;
    --glass: rgba(150,175,215,0.055);
    --glass-strong: rgba(150,175,215,0.1);
    --line-soft: rgba(170,190,220,0.18);
    --gold-line: rgba(211,178,104,0.5);
    --chamfer: 10px;
    --selected: #ffd580;
    --danger: #ff8c9b;
    --danger-strong: #ff455d;
    --danger-border: #a43b50;
    --danger-surface: #321825;
    --focus-ring: #f6c177;
    --shadow: #000000;
    --seat-you: #4ea3ff;
    --seat-opponent: var(--danger);
    --legal: #7ee2a8;
    --ink-on-legal: #06170d;
    --scrollbar-thumb: #73829d;
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
    --space-4: 1rem; --space-5: 1.5rem;
    --radius-sm: 0.15rem; --radius-md: 0.25rem;
    --font-ui: "Source Serif 4", Georgia, ui-serif, serif;
    --font-display: "Forum", "Source Serif 4", Georgia, serif;
    --text-xs: 0.72rem; --text-sm: 0.85rem; --text-md: 1rem;

    /* adjustable */
    --p-pane-width: 30rem;
    --p-tile-min: 12rem;
    --p-grid-gap: 0.75rem;
    --p-art-opacity: 0.75;
    --p-avatar-h: 6rem;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    color: var(--text);
    background: radial-gradient(ellipse 120% 70% at 50% -10%, #0d1a33 0%, var(--bg) 60%);
    font-family: var(--font-ui); font-size: var(--text-md);
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

  .proto-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 90;
    display: flex; gap: var(--space-3); align-items: baseline;
    padding: 0.3rem var(--space-3);
    background: #000; border-bottom: 1px solid var(--gold-line);
    font-size: var(--text-xs); color: var(--muted);
  }
  .proto-banner b { color: var(--accent); }
  .stage { position: fixed; inset: 1.6rem 0 0 0; }

  .toolbar {
    position: fixed; top: 2.3rem; right: 0.6rem; z-index: 95; width: 17rem;
    background: rgba(0,0,0,0.9); border: 1px solid var(--gold-line);
    border-radius: var(--radius-md); font-size: var(--text-xs);
  }
  .toolbar-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.35rem 0.6rem; cursor: grab; user-select: none;
    color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .toolbar-head button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }
  .toolbar-body { display: grid; gap: 0.45rem; padding: 0 0.6rem 0.6rem; }
  .toolbar.collapsed .toolbar-body { display: none; }
  .toolbar label { display: grid; gap: 0.15rem; color: var(--muted); }
  .toolbar output { color: var(--text); float: right; }
  .toolbar .row-copy { display: flex; justify-content: flex-end; }
  .toolbar .row-copy button {
    padding: 0.25rem 0.6rem; cursor: pointer; font: inherit;
    border: 1px solid var(--accent); border-radius: var(--radius-sm);
    background: none; color: var(--accent);
  }

  /* ── layout: left column (titlebar / grid / footer) + full-height pane ── */
  .screen {
    display: grid; height: 100%; min-height: 0;
    grid-template-columns: minmax(0, 1fr) var(--p-pane-width);
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: var(--space-3);
    padding: var(--space-3);
  }

  .titlebar {
    grid-column: 1; grid-row: 1;
    display: flex; align-items: center; gap: var(--space-3);
  }
  .eyebrow {
    margin: 0; color: var(--muted); font-size: var(--text-xs);
    font-family: var(--font-display); letter-spacing: 0.22em; text-transform: uppercase;
    white-space: nowrap;
  }
  h1.title {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: 1.3rem; letter-spacing: 0.12em; text-transform: uppercase;
    white-space: nowrap;
  }
  .titlebar .sep { color: var(--gold-line); }
  .titlebar select, .titlebar input {
    min-height: 2.4rem; padding: var(--space-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); background: var(--surface-chain); font: inherit;
  }
  .titlebar input[type="search"] { flex: 1 1 auto; min-width: 6rem; }

  /* Deck card section scrolls; gutter reserved so the bar never shifts tiles. */
  .grid {
    grid-column: 1; grid-row: 2;
    display: grid; overflow-y: auto; min-height: 0; align-content: start;
    scrollbar-gutter: stable;
    gap: var(--p-grid-gap); grid-auto-rows: max-content;
    grid-template-columns: repeat(auto-fill, minmax(min(var(--p-tile-min), 100%), 1fr));
    padding-right: var(--space-2);
  }

  .deck-tile {
    position: relative; overflow: hidden; aspect-ratio: 1/1; width: 100%;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface-raised); cursor: pointer; padding: 0;
    color: var(--text); font: inherit; text-align: left;
  }
  .deck-tile img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: var(--p-art-opacity);
  }
  .deck-tile .name {
    position: absolute; top: var(--space-2); left: var(--space-2);
    max-width: 72%; padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--shadow) 65%, transparent);
    font-weight: 650; line-height: 1.15; font-size: 0.95rem;
    text-shadow: 0 1px 2px var(--shadow);
  }
  .deck-tile .counts {
    position: absolute; bottom: var(--space-2); left: var(--space-2);
    padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--shadow) 65%, transparent);
    color: var(--muted); font-size: var(--text-xs);
  }
  .deck-tile.picked { border-color: var(--selected);
    box-shadow: 0 0 0.55rem color-mix(in srgb, var(--selected) 65%, transparent); }
  .deck-tile.opp-picked { border-color: var(--seat-opponent);
    box-shadow: 0 0 0.55rem color-mix(in srgb, var(--seat-opponent) 55%, transparent); }
  .deck-tile .check {
    position: absolute; top: var(--space-2); right: var(--space-2);
    width: 1.9rem; height: 1.9rem; display: grid; place-items: center;
    border-radius: var(--radius-sm); color: var(--selected);
    background: color-mix(in srgb, var(--shadow) 55%, transparent);
  }

  /* Footer: sticky bottom; Return left; manage cluster + Create right. */
  footer.actions {
    grid-column: 1; grid-row: 3;
    position: sticky; bottom: 0;
    display: flex; align-items: center; gap: var(--space-2);
    padding-top: var(--space-2);
    border-top: 1px solid var(--line-soft);
    background: var(--bg);
  }
  footer.actions .manage { display: flex; gap: var(--space-2); margin-left: auto; }
  button.back {
    min-height: 3.1rem; padding: 0 var(--space-5); cursor: pointer;
    font-family: var(--font-display); font-size: 1rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--danger); background: var(--danger-surface);
    border: 1px solid var(--danger-border); border-radius: var(--radius-sm);
  }
  button.back:hover { color: #fff; background: var(--danger-strong); border-color: var(--danger-strong); }
  button.secondary {
    min-height: 2.75rem; padding: 0 var(--space-3); cursor: pointer;
    font: inherit; color: var(--text);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  /* action hues: delete red, duplicate blue, rename yellow, create green */
  button.act-delete { color: var(--danger); border-color: var(--danger-border);
    background: color-mix(in srgb, var(--danger) 12%, var(--surface-raised)); }
  button.act-delete:hover { color: #fff; background: var(--danger-strong); border-color: var(--danger-strong); }
  button.act-duplicate { color: var(--seat-you); border-color: color-mix(in srgb, var(--seat-you) 55%, transparent);
    background: color-mix(in srgb, var(--seat-you) 12%, var(--surface-raised)); }
  button.act-duplicate:hover { color: #fff; background: color-mix(in srgb, var(--seat-you) 55%, var(--surface-raised)); }
  button.act-rename { color: var(--selected); border-color: color-mix(in srgb, var(--selected) 55%, transparent);
    background: color-mix(in srgb, var(--selected) 12%, var(--surface-raised)); }
  button.act-rename:hover { color: var(--ink-on-accent); background: var(--selected); }
  button.act-create { color: var(--ink-on-legal); border-color: var(--legal);
    background: var(--legal); font-weight: 650; }
  button.act-create:hover { filter: brightness(1.08); }

  /* compact footer: smaller Return, manage collapses into a ⋯ menu */
  .kebab-wrap { position: relative; display: none; }
  button.kebab {
    min-height: 2.75rem; min-width: 2.75rem; cursor: pointer; font: inherit;
    font-size: 1.2rem; color: var(--text);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .kebab-menu {
    position: absolute; right: 0; bottom: calc(100% + 0.4rem); z-index: 40;
    display: grid; gap: var(--space-1); min-width: 10rem;
    padding: var(--space-2);
    background: var(--surface-raised); border: 1px solid var(--gold-line);
    border-radius: var(--radius-md);
    box-shadow: 0 0.5rem 1.5rem var(--shadow);
  }
  .kebab-menu button { text-align: left; }
  body.compact-footer footer.actions .manage { display: none; }
  body.compact-footer .kebab-wrap { display: block; margin-left: auto; }
  body.compact-footer button.back {
    min-height: 2.5rem; padding: 0 var(--space-3); font-size: var(--text-sm);
  }

  /* compact header: eyebrow + separator drop, title shortens (JS swaps text) */
  body.compact-header .eyebrow, body.compact-header .titlebar .sep { display: none; }

  /* ── right pane: full height; avatars fixed top, Start fixed bottom,
        only the decklists scroll ── */
  .pane {
    grid-column: 2; grid-row: 1 / -1;
    display: grid; min-height: 0;
    grid-template-rows: minmax(0, 1fr) max-content;
    gap: var(--space-3);
    padding: var(--space-3);
    background: var(--glass);
    border: 1px solid var(--line-soft);
    border-left: 1px solid var(--gold-line);
    border-radius: var(--radius-sm);
  }
  .seats { display: grid; min-height: 0; gap: var(--space-3);
    grid-template-columns: 1fr 1fr; }
  .seat-section { display: grid; min-height: 0; gap: var(--space-2);
    grid-template-rows: max-content max-content minmax(0, 1fr); }

  .avatar {
    position: relative; overflow: hidden; border: 1px solid var(--border);
    border-radius: var(--radius-md); background: var(--surface-panel);
  }
  .avatar svg { display: block; width: 100%; height: var(--p-avatar-h); }
  .avatar .fig-opp { fill: color-mix(in srgb, var(--seat-opponent) 26%, transparent); }
  .avatar .fig-you { fill: color-mix(in srgb, var(--seat-you) 26%, transparent); }
  .avatar .who {
    position: absolute; left: var(--space-2); bottom: var(--space-2);
    padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--shadow) 70%, transparent);
    font-family: var(--font-display); letter-spacing: 0.12em;
    text-transform: uppercase; font-size: var(--text-sm);
  }

  .seat-chip {
    display: grid; gap: 0.1rem; text-align: left; cursor: pointer;
    padding: var(--space-2) var(--space-3);
    background: var(--glass-strong); border: 1px solid var(--line-soft);
    border-left: 3px solid var(--seat-you); border-radius: var(--radius-sm);
    color: var(--text); font: inherit;
    clip-path: polygon(var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }
  .seat-chip.opp { border-left-color: var(--seat-opponent); }
  .seat-chip .deck-name { font-weight: 650; font-size: 1rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-chip.filling { outline: 2px solid var(--selected); outline-offset: 2px; }

  /* Decklist: production DecklistPanel row grammar — frame-color edge, art
     background, fade, copies chip. Scrolls in place, gutter reserved. */
  .decklist {
    overflow-y: auto; min-height: 0;
    scrollbar-gutter: stable;
    padding-right: var(--space-1);
    display: block; align-content: start;
  }
  .decklist.previewing { outline: 1px dashed var(--selected); outline-offset: 3px; }
  .decklist h3 {
    margin: var(--space-2) 0 var(--space-1);
    color: var(--muted); font-size: var(--text-xs);
    letter-spacing: 0.08em; text-transform: uppercase;
    font-family: var(--font-ui); font-weight: 400;
  }
  .decklist h3:first-child { margin-top: 0; }
  .decklist ul { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; }
  .lrow {
    position: relative; display: flex; align-items: center;
    height: 30px; overflow: hidden;
    border-left: 5px solid var(--fc);
    border-radius: 5px; background: #22252c;
  }
  .lrow .cp {
    position: relative; z-index: 2; align-self: stretch; min-width: 24px;
    display: flex; align-items: center; justify-content: center;
    background: #000a; color: #e8e9ec;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .lrow .cp.single { background: #0006; }
  .lrow .art {
    position: absolute; z-index: 0; inset: 0;
    background-image: var(--img);
    background-position: center 20%; background-size: cover; opacity: 0.6;
  }
  .lrow .fade {
    position: absolute; z-index: 1; inset: 0;
    background: linear-gradient(90deg, #22252c 0%, #22252ccc 38%, #22252c00 100%);
  }
  .lrow .cname {
    position: relative; z-index: 2; flex: 1;
    padding: 0 8px 0 6px; overflow: hidden;
    font-size: 13px; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  button.start {
    width: 100%; min-height: 3.1rem; padding: 0 var(--space-5); cursor: pointer;
    font-family: var(--font-display); font-size: 1.05rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-on-accent);
    background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    border: 0;
    clip-path: polygon(var(--chamfer) 0, 100% 0, 100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%, 0 100%, 0 var(--chamfer));
  }
  button.start:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<div class="proto-banner">
  <b>PROTOTYPE v3 · Twin Columns (validated E)</b>
  <span>You left · opponent right; avatars + Start fixed, lists scroll; production decklist rows with art; centered manage cluster; 36 decks.</span>
</div>

<div class="stage" id="stage"></div>

<div class="toolbar" id="toolbar">
  <div class="toolbar-head" id="toolbar-drag">
    <span>Parameters</span><button id="toolbar-toggle">–</button>
  </div>
  <div class="toolbar-body">
    <label>Pane width <output id="o-pane">30rem</output>
      <input type="range" id="p-pane" min="22" max="38" step="0.5" value="30"></label>
    <label>Tile min size <output id="o-tile">12rem</output>
      <input type="range" id="p-tile" min="9" max="16" step="0.5" value="12"></label>
    <label>Grid gap <output id="o-gap">0.75rem</output>
      <input type="range" id="p-gap" min="0.25" max="1.5" step="0.25" value="0.75"></label>
    <label>Tile art opacity <output id="o-art">0.75</output>
      <input type="range" id="p-art" min="0.4" max="1" step="0.05" value="0.75"></label>
    <label>Avatar height <output id="o-ava">6rem</output>
      <input type="range" id="p-ava" min="4" max="11" step="0.5" value="6"></label>
    <label>Chamfer <output id="o-cham">10px</output>
      <input type="range" id="p-cham" min="0" max="16" step="2" value="10"></label>
    <div class="row-copy"><button id="copy-params">Copy parameters</button></div>
  </div>
</div>

const IMG = (c) => `../generated/card-images/archive/cropped/${c}.jpg`;
/* src/decks/card-frame.ts CARD_FRAME_COLORS */
const FRAME_COLORS = {
  normal: "#b8985a", effect: "#c26a3d", ritual: "#4a6fb5", fusion: "#8a63b0",
  synchro: "#c9c9c9", xyz: "#4a4a55", link: "#1d6ea8", spell: "#1d9e74", trap: "#bc5a84",
};

const state = {
  playerKey: DATA.tiles[0].key,
  oppKey: DATA.tiles[1].key,
  seat: "player",
  filter: "",
  previewKey: null,
};
const tileOf = (k) => DATA.tiles.find((t) => t.key === k);
const countsLine = (t) => `Main ${t.m} · Extra ${t.e} · Side ${t.s}`;

function tilesHTML() {
  const f = state.filter.toLowerCase();
  return DATA.tiles.filter((t) => t.name.toLowerCase().includes(f)).map((t) => {
    const isPlayer = t.key === state.playerKey;
    const isOpp = state.seat === "opponent" && t.key === state.oppKey;
    return `<button class="deck-tile ${isPlayer && state.seat === "player" ? "picked" : ""} ${isOpp ? "opp-picked" : ""}" data-pick="${t.key}">
      <img src="${IMG(t.cover)}" alt="" loading="lazy">
      <span class="name">${t.name}</span>
      <span class="counts">${countsLine(t)}</span>
      ${isPlayer ? '<span class="check">✓</span>' : ""}
    </button>`;
  }).join("");
}

function rowsHTML(rows) {
  return rows.map((r) => {
    const style = `--fc:${FRAME_COLORS[r.frame]};` + (r.art ? `--img:url('${IMG(r.code)}')` : "");
    return `<li class="lrow" style="${style}">
      <span class="cp ${r.n === 1 ? "single" : ""}">${r.n}</span>
      ${r.art ? '<span class="art"></span><span class="fade"></span>' : ""}
      <span class="cname">${r.name}</span>
    </li>`;
  }).join("");
}

function decklistHTML(tileKey) {
  const t = tileOf(tileKey);
  const list = DATA.lists[t.list];
  const section = (label, rows) => rows.length === 0 ? "" :
    `<h3>${label} (${rows.reduce((a, r) => a + r.n, 0)})</h3><ul>${rowsHTML(rows)}</ul>`;
  return section("Main", list.main) + section("Extra", list.extra) + section("Side", list.side);
}

function seatSectionHTML(kind) {
  const opp = kind === "opponent";
  const pickedKey = opp ? state.oppKey : state.playerKey;
  const target = state.seat === kind && state.previewKey !== null;
  const listKey = target ? state.previewKey : pickedKey;
  const t = tileOf(pickedKey);
  return `<div class="seat-section">
    <div class="avatar">
      <svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="120" height="90" fill="var(--surface-panel)"/>
        <circle class="${opp ? "fig-opp" : "fig-you"}" cx="60" cy="38" r="17"/>
        <path class="${opp ? "fig-opp" : "fig-you"}" d="M24 92 Q60 56 96 92 Z"/>
      </svg>
      <span class="who">${opp ? "Aster the Novice" : "You"}</span>
    </div>
    <button class="seat-chip ${opp ? "opp" : ""} ${state.seat === kind ? "filling" : ""}" data-seat="${kind}">
      <span class="deck-name">${t.name}</span>
    </button>
    <div class="decklist ${target ? "previewing" : ""}">${decklistHTML(listKey)}</div>
  </div>`;
}

function paneHTML() {
  /* Req 4: you left, opponent right. */
  return `<aside class="pane">
    <div class="seats">
      ${seatSectionHTML("player")}
      ${seatSectionHTML("opponent")}
    </div>
    <button class="start" data-start>Start the Duel</button>
  </aside>`;
}

function render() {
  document.getElementById("stage").innerHTML = `<section class="screen">
    <div class="titlebar">
      <p class="eyebrow">Free Play</p>
      <h1 class="title" data-title>Choose your deck</h1>
      <span class="sep">·</span>
      <label>
        <select><option>Last modified</option><option>Name</option></select>
      </label>
      <input type="search" placeholder="Filter decks…" data-filter value="${state.filter}">
    </div>
    <div class="grid">${tilesHTML()}</div>
    <footer class="actions">
      <button class="back" data-back>← Return to Menu</button>
      <div class="manage">
        <button class="secondary act-delete">Delete</button>
        <button class="secondary act-rename">Rename</button>
        <button class="secondary act-duplicate">Duplicate</button>
        <button class="secondary">Open</button>
        <button class="secondary act-create" data-create>+ Create</button>
      </div>
      <div class="kebab-wrap">
        <button class="kebab" data-kebab aria-label="Deck actions">⋯</button>
      </div>
    </footer>
    ${paneHTML()}
  </section>`;
}
function renderPane() {
  const seats = document.querySelector(".seats");
  if (seats) seats.innerHTML = seatSectionHTML("player") + seatSectionHTML("opponent");
}
function renderGrid() {
  const grid = document.querySelector(".grid");
  if (grid) grid.innerHTML = tilesHTML();
}

const stage = document.getElementById("stage");
stage.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    if (state.seat === "opponent") state.oppKey = pick.dataset.pick;
    else state.playerKey = pick.dataset.pick;
    state.previewKey = null;
    renderGrid(); renderPane(); return;
  }
  const seatBtn = e.target.closest("[data-seat]");
  if (seatBtn) {
    const kind = seatBtn.dataset.seat;
    state.seat = kind === "opponent" && state.seat !== "opponent" ? "opponent" : "player";
    state.previewKey = null;
    renderGrid(); renderPane(); return;
  }
  if (e.target.closest("[data-start]")) { alert("Stub: would start the duel."); return; }
  if (e.target.closest("[data-back]")) { alert("Stub: would return to the menu."); return; }
  if (e.target.closest("[data-create]")) { alert("Stub: would create a new deck."); return; }
  const kebab = e.target.closest("[data-kebab]");
  if (kebab) { toggleKebab(); return; }
  if (!e.target.closest(".kebab-menu")) closeKebab();
});

/* ── compact ⋯ menu (small screens) ── */
let kebabOpen = false;
function toggleKebab() { kebabOpen ? closeKebab() : openKebab(); }
function openKebab() {
  closeKebab();
  kebabOpen = true;
  const wrap = document.querySelector(".kebab-wrap");
  const menu = document.createElement("div");
  menu.className = "kebab-menu";
  menu.innerHTML = `
    <button class="secondary act-delete">Delete</button>
    <button class="secondary act-rename">Rename</button>
    <button class="secondary act-duplicate">Duplicate</button>
    <button class="secondary">Open</button>
    <button class="secondary act-create" data-create>+ Create</button>`;
  wrap.appendChild(menu);
}
function closeKebab() {
  kebabOpen = false;
  document.querySelector(".kebab-menu")?.remove();
}

/* ── responsive header/footer: probe-measured, not breakpoint-guessed.
   The probes carry the FULL content at max-content width; when a probe no
   longer fits the live bar's width the bar flips compact — so the trigger is
   real overflow whatever the pane width slider says. ── */
function measureCompact() {
  const bar = document.querySelector(".titlebar");
  const foot = document.querySelector("footer.actions");
  if (!bar || !foot) return;
  const probe = (html, cls) => {
    const el = document.createElement("div");
    el.className = cls;
    el.style.cssText = "position:absolute;visibility:hidden;width:max-content;left:-9999px";
    el.innerHTML = html;
    document.body.appendChild(el);
    const w = el.getBoundingClientRect().width;
    el.remove();
    return w;
  };
  /* header probe: full version incl. eyebrow + long title + 12rem of input */
  const headW = probe(`<p class="eyebrow">Free Play</p><h1 class="title">Choose your deck</h1><span class="sep">·</span><label><select><option>Last modified</option></select></label><input type="search" style="width:12rem">`, "titlebar");
  const compactHeader = headW > bar.clientWidth;
  document.body.classList.toggle("compact-header", compactHeader);
  const title = document.querySelector("[data-title]");
  if (title) title.textContent = compactHeader ? "Select Deck" : "Choose your deck";
  /* footer probe: full-size Return + all five buttons */
  const footW = probe(`<button class="back">← Return to Menu</button><div class="manage" style="display:flex;gap:0.5rem"><button class="secondary">Delete</button><button class="secondary">Rename</button><button class="secondary">Duplicate</button><button class="secondary">Open</button><button class="secondary">+ Create</button></div>`, "actions") + 24;
  const compactFooter = footW > foot.clientWidth;
  document.body.classList.toggle("compact-footer", compactFooter);
  if (!compactFooter) closeKebab();
}
window.addEventListener("resize", measureCompact);

stage.addEventListener("pointerover", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick === null || state.previewKey === pick.dataset.pick) return;
  state.previewKey = pick.dataset.pick;
  renderPane();
});
stage.addEventListener("pointerout", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick === null) return;
  const to = e.relatedTarget;
  if (to instanceof Node && pick.contains(to)) return;
  state.previewKey = null;
  renderPane();
});

stage.addEventListener("input", (e) => {
  if (e.target.matches("[data-filter]")) {
    state.filter = e.target.value;
    renderGrid();
  }
});

/* params toolbar */
const params = [
  { id: "p-pane", out: "o-pane", varName: "--p-pane-width", unit: "rem", label: "Pane width" },
  { id: "p-tile", out: "o-tile", varName: "--p-tile-min", unit: "rem", label: "Tile min size" },
  { id: "p-gap",  out: "o-gap",  varName: "--p-grid-gap", unit: "rem", label: "Grid gap" },
  { id: "p-art",  out: "o-art",  varName: "--p-art-opacity", unit: "", label: "Tile art opacity" },
  { id: "p-ava",  out: "o-ava",  varName: "--p-avatar-h", unit: "rem", label: "Avatar height" },
  { id: "p-cham", out: "o-cham", varName: "--chamfer", unit: "px", label: "Chamfer" },
];
for (const p of params) {
  const input = document.getElementById(p.id);
  input.addEventListener("input", () => {
    document.documentElement.style.setProperty(p.varName, input.value + p.unit);
    document.getElementById(p.out).textContent = input.value + (p.unit || "");
    measureCompact();
  });
}
document.getElementById("copy-params").onclick = async (e) => {
  const text = ["variant: E · Twin Columns (validated)",
    ...params.map((p) => `${p.label}: ${document.getElementById(p.id).value}${p.unit}`)].join("\n");
  try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied!"; }
  catch { prompt("Copy parameters:", text.replaceAll("\n", " | ")); }
  setTimeout(() => (e.target.textContent = "Copy parameters"), 1200);
};
document.getElementById("toolbar-toggle").onclick = (e) => {
  const bar = document.getElementById("toolbar");
  bar.classList.toggle("collapsed");
  e.target.textContent = bar.classList.contains("collapsed") ? "+" : "–";
};
(() => {
  const bar = document.getElementById("toolbar");
  const head = document.getElementById("toolbar-drag");
  let sx, sy, ox, oy, dragging = false;
  head.addEventListener("pointerdown", (e) => {
    if (e.target.tagName === "BUTTON") return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    const r = bar.getBoundingClientRect(); ox = r.left; oy = r.top;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    bar.style.left = ox + e.clientX - sx + "px";
    bar.style.top = oy + e.clientY - sy + "px";
    bar.style.right = "auto";
  });
  head.addEventListener("pointerup", () => (dragging = false));
})();

render();
measureCompact();
</script>
</body>
