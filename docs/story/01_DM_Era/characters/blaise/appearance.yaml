- heading: Scale comparison
  text: '[Twenty casual/academic circumference comparisons](assets/zomb-v2/blaise-scale-round5/comparison-standalone.html)
    show 30–120 cm in 10 cm steps, with one horizontally scrollable row per outfit. Blaise’s selected literal bust
    circumference is **40 cm**. All twenty use the selected black blush clip, omit spider pendants, and use plain
    academic clothing. The 40 cm casual and winter images are the current references; older dress and summer images
    predate the cleanup.


