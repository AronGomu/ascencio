[package]
name = "ascencio"
version = "0.1.0"
description = "Offline story duel simulator"
authors = ["Ascencio"]
edition = "2021"

[lib]
name = "ascencio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
mlua = { version = "0.11", features = ["lua53", "vendored"] }
cap-std = "4"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled", "blob"] }

# Startup hashes multi-GB content packages even in development.
[profile.dev.package.sha2]
opt-level = 3
