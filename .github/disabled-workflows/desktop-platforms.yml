name: desktop-platforms
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run setup -- --sources-only
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test tests/desktop-setup.test.ts
      - run: npx vitest run tests/unit/storage/package-export.test.ts tests/unit/storage/app-content-boundary.test.ts tests/unit/storage/asset-restructure.test.ts
      - run: npm run test:native:rust
      - run: npm run frontend:build
