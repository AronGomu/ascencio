direction: Selected character-specific clothing follows the visual design; shared academy uniform constraints apply
  where relevant.
outfits:
- id: casual
  name: Casual spider-gothic
  image: assets/zomb-v2/blaise-scale-round5/40-casual.png
  status: current selected 40 cm outfit reference
  prompt: assets/zomb-v2/blaise-scale-round5/40-casual-prompt.txt
  description: Black off-shoulder knit top with web-patterned sleeves/neckline, dark pleated skirt with web trim,
    opaque tights and ankle boots.
- id: winter
  name: Plain winter Red uniform
  image: assets/zomb-v2/blaise-scale-round5/40-winter.png
  status: current selected 40 cm outfit reference
  prompt: assets/zomb-v2/blaise-scale-round5/40-winter-prompt.txt
  description: Plain Red blazer, white shirt, plain black ribbon, unadorned lapels/cuffs, plain pleated skirt with
    Red stripe, opaque tights and low shoes.
accessories:
- id: spider-hair-clip
  status: selected on all outfits
  round: 3
  option: '20'
  name: Blushing charm
  bodyFill: black
  eyeMarks: ivory
  cheekMarks: dusty pink
  bow: dusty pink
  source: assets/zomb-v2/blaise-hairclips/application-round4/clip-20-casual-black.png
- id: choker
  status: allowed
  description: Plain choker; no pendant.
requiredElements:
- Selected black blushing spider clip retained on all outfits
- Plain Red academic tailoring and academy crest
excludedElements:
- Spider pendant on every outfit
- Spider/web embroidery, lace, pins or ribbon charms on academic clothes
narrative:
- Her current casual design wears a black off-shoulder knit top, a dark pleated skirt with web trim, opaque tights
  and ankle boots. Casual fabric may retain spiderweb styling. All outfits omit the spider pendant; the choker is
  plain. Her academic Red uniforms have plain tailoring and trim without spider/web motifs, pins or necklace charms;
  the selected spider hair clip remains. The owner selected this design in place of the former long-pink-haired
  academy-uniform studies. Her academy rank remains Red; summer and winter academy-uniform adaptations are available
  as the outfit studies below.
- heading: Spider-gothic outfit studies
  text: 'Current design rules retain the short bob, selected black blush spider clip and Zomb rendering. No outfit
    has a spider pendant. Casual clothes may retain web details; academic clothes use the plain Red uniform without
    spider or web motifs. Backgrounds stay separate. Earlier linked studies may predate this cleanup.


    - [Casual](assets/zomb-v2/blaise-scale-round5/40-casual.png): black off-shoulder knit top, web-patterned sleeves
    and neckline, pleated web-trim skirt, opaque tights and ankle boots.

    - Historical summer study (predates the motif cleanup): [Summer Red uniform](assets/zomb-v2/blaise-proportions-80cm/summer.png):
    Red polo with white collar and trim, academy crest, plain collar and trim, dark skirt with Red stripe, opaque
    tights and low shoes.

    - [Winter Red uniform](assets/zomb-v2/blaise-scale-round5/40-winter.png): Red blazer, white shirt, plain black
    ribbon, unadorned lapels and cuffs, plain pleated skirt with Red stripe, opaque tights and low shoes.'
- heading: Hair-clip options
  text: 'The owner selected **round 3, option 20: Blushing charm, black fill**. The clip uses ivory eyes, small
    pink cheeks and a dusty-pink bow. This selection applies across outfits. The selected bust circumference is
    40 cm; other circumferences are comparison studies only.


    - [Round 3: twenty outline refinements](assets/zomb-v2/blaise-hairclips/outline-round3/comparison-standalone.html):
    body shapes 01–08, bow treatments 09–14, expressions 15–20.

    - [Round 2: five flat ribbon-spider icons](assets/zomb-v2/blaise-hairclips/ribbon-icons/comparison-standalone.html).

    - [Round 1: ten cute spider hair clips](assets/zomb-v2/blaise-hairclips/comparison-standalone.html).


    The [round-4 application comparison](assets/zomb-v2/blaise-hairclips/application-round4/comparison-standalone.html)
    applies shortlisted clips 17, 19 and 20 to casual wear and the winter Red uniform, each with white and black
    spider fill: exactly twelve comparison renders. Clothing colors and the 80 cm reference proportions are retained.'
uniformReference: ../../visual-direction.md
