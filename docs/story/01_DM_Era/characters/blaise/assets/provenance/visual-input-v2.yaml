prompt: 'Use case: identity-preserve / stylized adult character proportion study. Edit the provided existing
  adult Blaise casual outfit image to add the requested LOW VISUAL SCALE LEVEL 40.

  IMPORTANT SCALE MEANING: level 40 is a stylized illustration-comparison label, NOT a plausible measured
  adult bust circumference. Do NOT shrink the adult rib cage, shoulders or torso width to literal 40 cm,
  do NOT make her underweight, and do NOT make her younger. Keep the exact same clearly ADULT woman, same
  face, body build, height, shoulders, slim waist and hips, long adult limbs, pose and complete framing.
  Vary only the subtle chest/garment contour. Requested contour: a flat adult upper-torso silhouette with
  only extremely subtle natural garment rounding. No concave torso or exaggerated anatomy. Fully opaque
  fitted everyday clothing, neutral non-suggestive fashion reference, no exposed chest or cleavage emphasis.

  Preserve exact short ivory/pink-tinted bob, bangs, red eyes, current expression and selected BLACK BLUSH
  spider hair clip: compact flat black icon with eight rounded loop legs, ivory dot eyes, pink cheeks
  and pink bow at upper right. No spider pendant on any outfit. Keep the black off-shoulder knit top,
  existing web lace/embroidery on casual clothing, dark pleated skirt, opaque tights and black ankle boots,
  plus plain pendant-free black choker.

  Same Zomb style: simplified retro anime cel shapes, muted gray contours, matte materials, restrained
  pale-pink shading, fine character CRT scanlines, subtle red/cyan ghost edges. Plain neutral gray review
  backdrop unchanged. One complete full adult figure with feet and hair inside the same frame. No scene
  decoration, stars, text, numbers, measurement labels or watermark.'
