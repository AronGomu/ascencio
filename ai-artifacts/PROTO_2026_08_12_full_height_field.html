<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype — full-height duel field, defense-capable zones, right rail</title>
    <style>
      :root {
        --surface: #111b2f;
        --surface-strong: #18243b;
        --border: #697895;
        --muted: #a9b5ca;
        --accent: #73daca;
        --warning: #ffd580;
        --success: #7ee2a8;
        --ink: #fff;
        --preview-w: 22rem;
        --rail-min: 15rem;
        color: #e8edf8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      @media (max-width: 1500px) {
        :root { --preview-w: 18rem; --rail-min: 12rem; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% -10%, #1e3a5f 0, transparent 35rem),
          #08101f;
      }

      .shell {
        height: 100svh;
        display: grid;
        grid-template-columns: var(--preview-w) auto minmax(var(--rail-min), 1fr);
        align-items: stretch;
      }
      .shell[data-preview="off"] { grid-template-columns: 0 auto minmax(var(--rail-min), 1fr); }

      /* ---------- left: card preview -------------------------------------- */
      .preview {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr);
        gap: 0.5rem;
        min-height: 0;
        padding: 0.75rem;
        overflow: hidden;
        border-right: 1px solid rgb(105 120 149 / 0.4);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
      }
      .shell[data-preview="off"] .preview { display: none; }
      .preview h2 { margin: 0; font-size: 1rem; line-height: 1.2; }
      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .preview__art {
        aspect-ratio: 59 / 86;
        max-height: 34svh;
        justify-self: center;
        width: auto;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 0.5rem;
        border: 1px dashed var(--border);
        border-radius: 0.5rem;
        background: repeating-linear-gradient(
          135deg, #16233a, #16233a 6px, #131e33 6px, #131e33 12px);
        color: var(--muted);
        font-size: 0.7rem;
        text-align: center;
      }
      .preview__meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        color: var(--muted);
        font-size: 0.7rem;
      }
      .preview__meta span {
        padding: 0.2rem 0.5rem;
        border: 1px solid rgb(105 120 149 / 0.6);
        border-radius: 999px;
      }
      /* The meta chips size to content, the text takes the rest and scrolls;
         without this the wrapper grew to its content and nothing scrolled. */
      .preview__body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 0.4rem;
        min-height: 0;
      }
      .preview__text {
        min-height: 0;
        overflow-y: auto;
        /* Gutter is always reserved, so the text wraps identically whether or
           not the bar is showing, and the bar never sits over the panel edge. */
        scrollbar-gutter: stable;
        padding-right: 0.5rem;
        border-top: 1px solid rgb(105 120 149 / 0.35);
        padding-top: 0.5rem;
        color: #dbe3f2;
        font-size: 0.8rem;
        line-height: 1.5;
        scrollbar-width: thin;
        scrollbar-color: rgb(140 156 186 / 0.9) rgb(105 120 149 / 0.18);
      }
      .preview__text p { margin: 0 0 0.7rem; }
      .preview__text p:last-child { margin-bottom: 0; }
      .preview select {
        width: 100%;
        padding: 0.35rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: #0d1729;
        color: #e8edf8;
        font: inherit;
        font-size: 0.75rem;
      }

      /* ---------- middle: the board --------------------------------------- */
      .stage-wrap { min-width: 0; display: grid; place-items: center; }
      .board {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border-inline: 1px solid #436558;
        background:
          linear-gradient(180deg, rgb(115 218 202 / 0.1), transparent 50%),
          linear-gradient(135deg, #173f36, #102e2a);
      }

      .zone, .hand, .phase-group {
        position: absolute;
        left: var(--fx);
        top: var(--fy);
        width: var(--fw);
        height: var(--fh);
        transform: translate(-50%, -50%);
      }

      /* The zone is the square footprint a card may occupy in any position:
         drawn as a dashed outline only. Every zone in the game uses it, and
         all zones sit on one uniform 2px pitch, so two Defense-Position
         cards in neighbouring zones are separated by exactly that 2px. */
      .zone {
        z-index: 10;
        display: grid;
        place-items: center;
        border: 1px dashed rgb(183 220 207 / 0.3);
        border-radius: 0.2rem;
      }
      .zone.is-legal { border-color: var(--success); border-style: dashed; }

      /* The card container the player actually reads: an upright, slightly
         wider-than-card rectangle. A Defense card rotates out past its left
         and right edges, but never past the dashed square. */
      .zone__slot {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        width: var(--slot-w);
        height: var(--slot-h);
        padding: 0 2px;
        border: 1px solid rgb(183 220 207 / 0.5);
        border-radius: 0.25rem;
        background: rgb(9 32 29 / 0.45);
        color: rgb(232 237 248 / 0.6);
        font-size: var(--label-size);
        line-height: 1.1;
        text-align: center;
      }
      .zone.is-shared .zone__slot { border-color: var(--accent); color: #e8edf8; }
      .zone.is-legal .zone__slot {
        border-color: var(--success);
        box-shadow: 0 0 0 1px var(--success);
      }

      .card {
        grid-area: 1 / 1;
        width: var(--card-w);
        height: var(--card-h);
        border: 1px solid rgb(232 237 248 / 0.55);
        border-radius: 0.2rem;
        background: repeating-linear-gradient(
          135deg, #24405c, #24405c 4px, #1d3550 4px, #1d3550 8px);
      }
      .card.is-defense { transform: rotate(90deg); }
      .card.is-set {
        transform: rotate(90deg);
        border-style: dashed;
        background: repeating-linear-gradient(
          45deg, #3a2b4d, #3a2b4d 4px, #2f2340 4px, #2f2340 8px);
      }
      body[data-cards="off"] .card { display: none; }

      .card.is-pile {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #1d3f57, #14293a);
        box-shadow: 2px 2px 0 rgb(0 0 0 / 0.35), 4px 4px 0 rgb(0 0 0 / 0.2);
        font-size: var(--label-size);
        font-weight: 800;
      }

      .hand {
        z-index: 100;
        border-radius: 0.25rem;
        background: rgb(8 24 22 / 0.32);
        box-shadow: inset 0 0 0 1px rgb(183 220 207 / 0.2);
      }
      /* The native scrollbar is suppressed and replaced by an overlay bar
         below, so a scrolling hand never steals height from the cards. */
      .hand__scroll {
        height: 100%;
        display: flex;
        gap: var(--gap);
        align-items: center;
        justify-content: safe center;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      .hand__scroll::-webkit-scrollbar { display: none; }
      .hand .card { flex: 0 0 auto; grid-area: auto; }
      .hand.is-opponent .card { opacity: 0.7; }

      /* Card count, pinned to the hand's bottom-right corner and painted over
         the cards when the hand is full enough to reach it. */
      .hand__count {
        position: absolute;
        z-index: 3;
        right: 4px;
        bottom: 4px;
        min-width: 1.6em;
        padding: 0.15em 0.45em;
        border: 1px solid rgb(183 220 207 / 0.45);
        border-radius: 999px;
        background: rgb(6 18 16 / 0.86);
        color: #e8edf8;
        font-size: calc(var(--label-size) * 1.35);
        font-weight: 850;
        line-height: 1.3;
        text-align: center;
        pointer-events: none;
      }
      .hand__bar {
        position: absolute;
        z-index: 2;
        left: 6px;
        right: 6px;
        bottom: 3px;
        height: 6px;
        display: none;
        border-radius: 999px;
        background: rgb(232 237 248 / 0.14);
        touch-action: none;
      }
      .hand__bar.is-visible { display: block; }
      .hand__bar i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: rgb(183 220 207 / 0.7);
        cursor: grab;
      }

      .phase-group {
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        height: auto;
        pointer-events: none;
      }
      .phase-group--left { justify-content: flex-end; }
      .phase-group--right { justify-content: flex-start; }
      .phase-group--center { justify-content: center; }
      .phase-group--end { justify-content: flex-end; }
      .chip {
        pointer-events: auto;
        padding: 0.35em 0.75em;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgb(17 27 47 / 0.9);
        color: var(--muted);
        font-size: var(--chip-size);
        font-weight: 700;
        white-space: nowrap;
      }
      .chip.is-current { border-color: var(--accent); color: var(--ink); }
      .chip.is-end {
        padding: 0.6em 1.3em;
        border-color: transparent;
        border-radius: 0.7rem;
        background: var(--warning);
        color: #2b1d00;
        font-size: calc(var(--chip-size) * 1.5);
        font-weight: 850;
        box-shadow: 0 0.15rem 0.6rem rgb(0 0 0 / 0.35);
        cursor: pointer;
      }

      /* ---------- right rail ---------------------------------------------- */
      .rail {
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: 0.75rem;
        padding: 0.75rem;
        overflow: hidden;
        border-left: 1px solid rgb(105 120 149 / 0.4);
        background: color-mix(in srgb, var(--surface-strong) 92%, transparent);
      }
      /* Turn + phase only, on the options button's own centre line. */
      .rail__top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.6rem;
        align-items: center;
        min-height: 2.5rem;
      }
      .rail__turn {
        margin: 0;
        min-width: 0;
        font-size: 0.95rem;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .rail__options {
        display: grid;
        place-items: center;
        width: 2.5rem;
        height: 2.5rem;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 0.7rem;
        background: rgb(13 23 41 / 0.9);
        color: #e8edf8;
        cursor: pointer;
      }
      .rail__options svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }

      .rail__player {
        display: grid;
        gap: 0.5rem;
        padding: 0.6rem;
        border: 1px solid rgb(105 120 149 / 0.45);
        border-radius: 0.9rem;
        background: #0d1729;
        text-align: center;
      }
      .rail__player--opponent { margin-top: 0.5rem; }
      .rail__avatar {
        justify-self: center;
        width: 100%;
        aspect-ratio: 1;
        max-height: 26svh;
        border: 2px solid var(--border);
        border-radius: 0.7rem;
        background:
          radial-gradient(circle at 50% 36%, #7d8db0 26%, transparent 27%),
          radial-gradient(ellipse 46% 30% at 50% 92%, #7d8db0 60%, transparent 61%),
          linear-gradient(160deg, #1d2b45, #16223a);
      }
      .rail__player.is-turn .rail__avatar { border-color: var(--accent); }
      .rail__lp { display: grid; gap: 0.1rem; }
      .rail__role {
        color: var(--muted);
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .rail__lp b { font-size: 1.3rem; font-weight: 850; }

      /* Live game status: title + subtitle, no border, no scrollbar, never
         more than a couple of lines. Additive to the prompt dialogs. */
      .rail__status {
        align-self: center;
        display: grid;
        gap: 0.15rem;
        padding: 0.25rem 0.2rem;
        overflow: hidden;
        text-align: center;
      }
      .rail__status h2 {
        margin: 0;
        font-size: clamp(1.05rem, 1.4cqw + 0.8rem, 1.6rem);
        font-weight: 850;
        line-height: 1.15;
        text-wrap: balance;
      }
      .rail__status p {
        margin: 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.3;
        text-wrap: balance;
      }
      .dots { display: inline-block; }
      .dots i {
        display: inline-block;
        font-style: normal;
        animation: dot 1.2s infinite;
      }
      .dots i:nth-child(2) { animation-delay: 0.2s; }
      .dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot {
        0%, 60%, 100% { opacity: 0.2; }
        30% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots i { animation: none; opacity: 0.7; }
      }

      /* ---------- prototype-only instrumentation --------------------------- */
      .devbar {
        position: fixed;
        z-index: 400;
        bottom: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 0.7rem;
        background: rgb(8 16 31 / 0.94);
        font-size: 0.7rem;
      }
      .devbar button, .devbar select {
        padding: 0.3rem 0.55rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: transparent;
        color: #e8edf8;
        font: inherit;
        cursor: pointer;
      }
      .devbar select { background: #0d1729; }
      .devbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      .devbar output { color: var(--muted); font-variant-numeric: tabular-nums; }
      .devbar label { display: flex; gap: 0.35rem; align-items: center; color: var(--muted); }
    </style>
  </head>
  <body data-cards="on">
    <div class="shell" id="shell" data-preview="on">
      <section class="preview">
        <p class="eyebrow">Card preview</p>
        <select id="preview-pick" aria-label="Preview card"></select>
        <div class="preview__art" id="preview-art">card art</div>
        <h2 id="preview-name"></h2>
        <div class="preview__body">
          <div class="preview__meta" id="preview-meta"></div>
          <div class="preview__text" id="preview-text"></div>
        </div>
      </section>

      <div class="stage-wrap">
        <div class="board" id="board"></div>
      </div>

      <aside class="rail">
        <div class="rail__top">
          <p class="rail__turn" id="rail-turn">Turn 3 · Main Phase 1</p>
          <button class="rail__options" type="button" aria-label="Options">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.63l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.38-1.04-.7-1.63-.94l-.36-2.54A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.6 8.48a.5.5 0 0 0 .12.63l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.72 14.15a.5.5 0 0 0-.12.63l1.92 3.32c.14.24.42.34.68.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.5.42h4c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.26.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.63l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" />
            </svg>
          </button>
        </div>

        <div class="rail__player rail__player--opponent is-turn">
          <div class="rail__avatar"></div>
          <div class="rail__lp">
            <span class="rail__role">Opponent</span>
            <b>8000 LP</b>
          </div>
        </div>

        <div class="rail__status" id="rail-status" aria-live="polite">
          <h2 id="status-title"></h2>
          <p id="status-subtitle"></p>
        </div>

        <div class="rail__player">
          <div class="rail__lp">
            <span class="rail__role">You</span>
            <b>8000 LP</b>
          </div>
          <div class="rail__avatar"></div>
        </div>
      </aside>
    </div>

    <div class="devbar">
      <button type="button" id="t-emz" aria-pressed="true">Extra Monster Zones</button>
      <button type="button" id="t-preview" aria-pressed="true">Preview panel</button>
      <button type="button" id="t-cards" aria-pressed="true">Occupied slots</button>
      <label>Hand <input type="range" id="hand-size" min="1" max="20" value="6" /></label>
      <label>Zone gap <input type="range" id="zone-gap" min="2" max="14" value="5" /></label>
      <select id="status-pick" aria-label="Rail status"></select>
      <output id="readout"></output>
    </div>

    <script type="module">
      /* ------------------------------------------------------------------
         Geometry, in real px.

         pitch P  : distance between neighbouring zone centres
         gap      : 2px, uniform between every zone on the board, horizontally
                    and vertically, with no block gaps anywhere
         zone box : P - gap, square, dashed outline, the card's full footprint
         card     : height = zone box side, width = height * 72/104
         defense  : rotate(90deg) only, so a rotated card spans the whole box
                    and two neighbours are exactly `gap` apart
         slot     : the visible card container, cardWidth + 6 wide, box tall —
                    a Defense card deliberately overflows it left and right
         ------------------------------------------------------------------ */
      let GAP = 5;            /* validated: uniform separation between every zone */
      const MARGIN = 0.15;    /* board outer margin, in units of P */
      const BAND = 0.55;      /* phase band height when there are no EMZs */
      const SLOT_PAD = 6;     /* slot is this much wider than the card */
      const CARD_ASPECT = 72 / 104;
      const COLS = 8;         /* field/extra | 5 central | deck/GY | banished */

      function buildLayout(emz, availW, availH) {
        const rows = emz ? 7 : 6;
        /* height = 2*margin + rows*box + (rows-1)*gap [+ band + gap]
                  = (2*MARGIN + rows)*P - gap [+ band + gap] */
        const hP = 2 * MARGIN + rows + (emz ? 0 : BAND);
        const hC = -GAP + (emz ? 0 : GAP);
        const wP = 2 * MARGIN + COLS;
        const wC = -GAP;
        const P = Math.min((availH - hC) / hP, (availW - wC) / wP);
        const box = P - GAP;
        const margin = MARGIN * P;
        const band = BAND * P;
        const width = wP * P + wC;
        const height = hP * P + hC;

        const rowY = [];
        let y = margin + box / 2;
        let bandY = 0;
        for (let i = 0; i < rows; i += 1) {
          if (!emz && i === 3) {
            bandY = y - box / 2 + band / 2;
            y += band + GAP;
          }
          rowY.push(y);
          y += P;
        }
        if (emz) bandY = rowY[3];

        const col = [];
        for (let i = 0; i < COLS; i += 1) col.push(margin + box / 2 + i * P);

        return {
          emz, P, box, width, height, margin, band, bandY, rowY,
          cardH: box, cardW: box * CARD_ASPECT,
          slotW: box * CARD_ASPECT + SLOT_PAD, slotH: box,
          sideCol: col[0], main: col.slice(1, 6), gyCol: col[6], banCol: col[7],
          emzX: [col[2] + P / 2, col[3] + P / 2],
          handOpp: rowY[0], spellOpp: rowY[1], monsterOpp: rowY[2],
          monsterMe: rowY[emz ? 4 : 3],
          spellMe: rowY[emz ? 5 : 4],
          handMe: rowY[emz ? 6 : 5],
        };
      }

      const slots = new Map([
        ["0:monster:0", "attack"],
        ["0:monster:2", "defense"],
        ["0:monster:3", "defense"],
        ["0:spellTrap:1", "attack"],
        ["0:spellTrap:3", "set"],
        ["1:monster:1", "attack"],
        ["1:monster:3", "set"],
        ["1:spellTrap:2", "attack"],
      ]);
      const legal = new Set(["0:monster:1", "0:monster:4"]);

      const board = document.getElementById("board");
      const shell = document.getElementById("shell");
      const readout = document.getElementById("readout");
      const handInput = document.getElementById("hand-size");
      let emz = true;

      /* Overlay scrollbar: drawn on top of the cards, never in the flow, so
         the cards keep the full height of the hand band. */
      function wireOverlayScrollbar(scroll, bar) {
        const thumb = bar.firstElementChild;
        const sync = () => {
          const ratio = scroll.clientWidth / scroll.scrollWidth;
          bar.classList.toggle("is-visible", ratio < 0.999);
          if (ratio >= 0.999) return;
          const track = bar.clientWidth;
          const width = Math.max(24, track * ratio);
          const max = scroll.scrollWidth - scroll.clientWidth;
          thumb.style.width = `${width}px`;
          thumb.style.transform =
            `translateX(${(scroll.scrollLeft / max) * (track - width)}px)`;
        };
        scroll.addEventListener("scroll", sync, { passive: true });
        thumb.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          thumb.setPointerCapture(event.pointerId);
          const startX = event.clientX;
          const startLeft = scroll.scrollLeft;
          const track = bar.clientWidth;
          const max = scroll.scrollWidth - scroll.clientWidth;
          const move = (moveEvent) => {
            const travel = track - thumb.offsetWidth;
            scroll.scrollLeft =
              startLeft + ((moveEvent.clientX - startX) / travel) * max;
          };
          const up = () => {
            thumb.removeEventListener("pointermove", move);
            thumb.removeEventListener("pointerup", up);
          };
          thumb.addEventListener("pointermove", move);
          thumb.addEventListener("pointerup", up);
        });
        requestAnimationFrame(sync);
      }

      function render() {
        const previewW =
          shell.dataset.preview === "on"
            ? document.querySelector(".preview").getBoundingClientRect().width
            : 0;
        const railMin = parseFloat(getComputedStyle(document.documentElement)
          .getPropertyValue("--rail-min")) * 16;
        const availW = window.innerWidth - previewW - railMin;
        const availH = document.documentElement.clientHeight;
        const L = buildLayout(emz, availW, availH);

        board.style.width = `${L.width}px`;
        board.style.height = `${L.height}px`;
        board.style.setProperty("--card-w", `${L.cardW}px`);
        board.style.setProperty("--card-h", `${L.cardH}px`);
        board.style.setProperty("--gap", `${GAP}px`);
        board.style.setProperty("--slot-w", `${L.slotW}px`);
        board.style.setProperty("--slot-h", `${L.slotH}px`);
        board.style.setProperty("--label-size", `${Math.max(7, L.P * 0.085)}px`);
        board.style.setProperty("--chip-size", `${Math.max(9, L.P * 0.1)}px`);
        board.replaceChildren();

        function place(el, x, y, w, h) {
          el.style.setProperty("--fx", `${x}px`);
          el.style.setProperty("--fy", `${y}px`);
          el.style.setProperty("--fw", `${w}px`);
          el.style.setProperty("--fh", `${h}px`);
          board.appendChild(el);
          return el;
        }

        function zone({ key, x, y, label, shared = false, pile }) {
          const el = document.createElement("div");
          el.className = "zone";
          if (shared) el.classList.add("is-shared");
          if (legal.has(key)) el.classList.add("is-legal");
          el.dataset.zone = key;

          const slot = document.createElement("div");
          slot.className = "zone__slot";
          el.appendChild(slot);

          if (pile !== undefined) {
            const card = document.createElement("div");
            card.className = "card is-pile";
            card.textContent = String(pile);
            card.title = label;
            el.appendChild(card);
          } else if (slots.has(key)) {
            const state = slots.get(key);
            const card = document.createElement("div");
            card.className = `card${state === "defense" ? " is-defense" : state === "set" ? " is-set" : ""}`;
            el.appendChild(card);
          } else {
            slot.textContent = label;
          }
          return place(el, x, y, L.box, L.box);
        }

        for (const player of [0, 1]) {
          const monsterY = player === 0 ? L.monsterMe : L.monsterOpp;
          const spellY = player === 0 ? L.spellMe : L.spellOpp;
          L.main.forEach((x, i) => {
            zone({ key: `${player}:monster:${i}`, x, y: monsterY, label: `Monster ${i + 1}` });
            zone({ key: `${player}:spellTrap:${i}`, x, y: spellY, label: `Spell/Trap ${i + 1}` });
          });
          zone({ key: `${player}:field:0`, x: L.sideCol, y: monsterY, label: "Field Zone" });
          zone({ key: `${player}:extra:0`, x: L.sideCol, y: spellY, label: "Extra Deck", pile: 15 });
          zone({ key: `${player}:graveyard:0`, x: L.gyCol, y: monsterY, label: "GY", pile: player === 0 ? 3 : 1 });
          zone({ key: `${player}:deck:0`, x: L.gyCol, y: spellY, label: "Deck", pile: player === 0 ? 31 : 34 });
          zone({ key: `${player}:banished:0`, x: L.banCol, y: monsterY, label: "Banished" });
        }

        if (emz) {
          zone({ key: "shared:emz:l", x: L.emzX[0], y: L.bandY, label: "Extra Monster", shared: true });
          zone({ key: "shared:emz:r", x: L.emzX[1], y: L.bandY, label: "Extra Monster", shared: true });
        }

        const handW = L.width - 2 * L.margin;
        const handCount = Number(handInput.value);
        for (const [player, y, count] of [
          [1, L.handOpp, Math.min(handCount, 8)],
          [0, L.handMe, handCount],
        ]) {
          const hand = document.createElement("div");
          hand.className = "hand" + (player === 1 ? " is-opponent" : "");
          const scroll = document.createElement("div");
          scroll.className = "hand__scroll";
          for (let i = 0; i < count; i += 1) {
            const card = document.createElement("div");
            card.className = "card";
            scroll.appendChild(card);
          }
          const badge = document.createElement("span");
          badge.className = "hand__count";
          badge.textContent = String(count);
          const bar = document.createElement("div");
          bar.className = "hand__bar";
          bar.appendChild(document.createElement("i"));
          hand.append(scroll, bar, badge);
          place(hand, L.width / 2, y, handW, L.box);
          wireOverlayScrollbar(scroll, bar);
        }

        const chips = (labels, mod) => {
          const group = document.createElement("div");
          group.className = `phase-group phase-group--${mod}`;
          for (const label of labels) {
            const chip = document.createElement("span");
            chip.className = "chip" + (label === "Main 1" ? " is-current" : "");
            chip.textContent = label;
            group.appendChild(chip);
          }
          return group;
        };
        const endGroup = document.createElement("div");
        endGroup.className = "phase-group phase-group--end";
        const end = document.createElement("button");
        end.type = "button";
        end.className = "chip is-end";
        end.textContent = "End turn";
        endGroup.appendChild(end);

        if (emz) {
          const leftEdge = L.emzX[0] - L.box / 2 - L.margin;
          const rightEdge = L.emzX[1] + L.box / 2 + L.margin;
          place(chips(["Draw", "Standby", "Main 1", "Battle"], "left"),
            (leftEdge - L.margin) / 2 + L.margin, L.bandY, leftEdge - L.margin, L.box);
          const pocket = (L.width - L.margin - rightEdge) / 2;
          place(chips(["Main 2"], "right"), rightEdge + pocket / 2, L.bandY, pocket, L.box);
          place(endGroup, L.width - L.margin - pocket / 2, L.bandY, pocket, L.box);
        } else {
          place(chips(["Draw", "Standby", "Main 1", "Battle", "Main 2"], "center"),
            L.width / 2, L.bandY, L.width - 2 * L.margin, L.band);
          place(endGroup, L.width / 2, L.bandY, L.width - 2 * L.margin, L.band);
        }

        readout.textContent =
          `board ${Math.round(L.width)}×${Math.round(L.height)}px · ` +
          `${((L.height / availH) * 100).toFixed(1)}% of viewport · ` +
          `zone ${Math.round(L.box)}px² · pitch ${Math.round(L.P)}px · ` +
          `card ${Math.round(L.cardW)}×${Math.round(L.cardH)}px · gap ${GAP}px`;
      }

      /* ---------------- rail status states -------------------------------- */
      const STATUS = [
        { title: "Chain · Link 2", sub: "Resolving backwards. Solemn Judgment resolves first.", dots: false },
        { title: "Opponent is thinking", sub: "Choosing a response to your Set card.", dots: true },
        { title: "Activating Mirror Force", sub: "Opponent · Trap · in response to your attack.", dots: true },
        { title: "Battle resolving", sub: "Dark Magician attacks directly.", dots: true },
        { title: "Your move", sub: "Main Phase 1 · 6 cards in hand.", dots: false },
      ];
      const statusPick = document.getElementById("status-pick");
      STATUS.forEach((entry, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = entry.title;
        statusPick.appendChild(option);
      });
      function showStatus() {
        const entry = STATUS[Number(statusPick.value)];
        const title = document.getElementById("status-title");
        title.textContent = entry.title;
        if (entry.dots) {
          const dots = document.createElement("span");
          dots.className = "dots";
          dots.append(...["·", "·", "·"].map((glyph) => {
            const i = document.createElement("i");
            i.textContent = glyph;
            return i;
          }));
          title.append(" ", dots);
        }
        document.getElementById("status-subtitle").textContent = entry.sub;
      }
      statusPick.value = "1";
      statusPick.addEventListener("change", showStatus);
      showStatus();

      /* ---------------- preview panel samples ----------------------------- */
      const CARDS = [
        {
          name: "Dark Magician",
          meta: ["Monster", "Spellcaster / Normal", "Level 7", "ATK 2500", "DEF 2100"],
          text: ["The ultimate wizard in terms of attack and defense."],
        },
        {
          name: "Mirror Force",
          meta: ["Trap", "Normal"],
          text: [
            "When an opponent's monster declares an attack: Destroy all your opponent's Attack Position monsters.",
          ],
        },
        {
          name: "Solemn Judgment",
          meta: ["Trap", "Counter"],
          text: [
            "When a monster would be Summoned, OR a Spell/Trap Card is activated: Pay half your LP; negate the Summon or activation, and if you do, destroy that card.",
          ],
        },
        {
          name: "Wall-of-text stress card (synthetic)",
          meta: ["Monster", "Dragon / Effect", "Level 10", "ATK 3200", "DEF 2800"],
          text: [
            "Cannot be Normal Summoned or Set. Must first be Special Summoned (from your hand) by banishing 3 monsters from your GY with different Types and different Attributes, and cannot be Special Summoned from the GY or while your opponent controls a monster with 3000 or more ATK.",
            "Once per turn, during either player's turn, when a card or effect is activated that would target exactly 1 card you control, or destroy exactly 1 card you control by an effect: You can discard 1 card, then target 1 card your opponent controls; negate that activation, and if you do, banish that target face-down until the End Phase of the next turn.",
            "Once per turn, during your Main Phase 1 only, if this card was Special Summoned this turn: You can pay 1000 LP; Special Summon 1 monster from your Extra Deck whose Level or Rank is lower than this card's Level, but its effects are negated, it cannot declare an attack, and it is banished when it leaves the field.",
            "During the End Phase, if this card is in Attack Position and was not used as material this turn: Shuffle 2 cards from your GY into the Deck, or, if you cannot, send this card to the GY. You can only control 1 copy of this card, and you can only use each effect of this card once per turn.",
            "This entry is synthetic filler written for this prototype to exercise the scroll region; it is not a real card's text.",
          ],
        },
      ];
      const pick = document.getElementById("preview-pick");
      CARDS.forEach((card, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = card.name;
        pick.appendChild(option);
      });
      function showCard() {
        const card = CARDS[Number(pick.value)];
        document.getElementById("preview-name").textContent = card.name;
        document.getElementById("preview-art").textContent = `${card.name} — art`;
        const meta = document.getElementById("preview-meta");
        meta.replaceChildren(...card.meta.map((entry) => {
          const span = document.createElement("span");
          span.textContent = entry;
          return span;
        }));
        const text = document.getElementById("preview-text");
        text.replaceChildren(...card.text.map((para) => {
          const p = document.createElement("p");
          p.textContent = para;
          return p;
        }));
        text.scrollTop = 0;
      }
      pick.value = "3";
      pick.addEventListener("change", showCard);
      showCard();

      function toggle(id, onClick) {
        const btn = document.getElementById(id);
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("aria-pressed") !== "true";
          btn.setAttribute("aria-pressed", String(next));
          onClick(next);
        });
      }
      toggle("t-emz", (on) => { emz = on; render(); });
      toggle("t-preview", (on) => { shell.dataset.preview = on ? "on" : "off"; render(); });
      toggle("t-cards", (on) => { document.body.dataset.cards = on ? "on" : "off"; });
      handInput.addEventListener("input", render);
      document.getElementById("zone-gap").addEventListener("input", (event) => {
        GAP = Number(event.target.value);
        render();
      });
      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
