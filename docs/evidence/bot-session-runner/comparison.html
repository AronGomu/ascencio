<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:light dark}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}button{font:inherit;font-size:12px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.chart{height:210px}.row{display:grid;grid-template-columns:64px 1fr 62px;gap:8px;align-items:center;height:40px;font-size:13px}.track{height:22px;background:var(--secondary);border-radius:4px;overflow:hidden}.bar{height:100%;background:var(--chart-1);transition:width .2s}.row.best .bar{background:var(--chart-2)}.value{text-align:right;font-variant-numeric:tabular-nums}.label{font-size:13px;margin-bottom:8px}.note{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:10px 0 0}.key{color:var(--foreground)}
</style></head><body><div class="controls"><button data-metric="wall" aria-pressed="true">Wall ÷ completed matches</button><button data-metric="latency" aria-pressed="false">Mean worker match latency</button><button data-metric="memory" aria-pressed="false">Peak tree RSS</button></div><div class="label" id="label"></div><div class="chart" id="chart"></div><p class="note">24 identical fixtures · 96 games per stage · one run each · no failures.<br><span class="key">6 workers selected.</span> Worker latency measures one match's service time; amortized wall time measures throughput. RSS sampled every 100 ms.</p><script>const data=[{"workers": 1, "wall": 2.3348788587916665, "latency": 1.9465537651666664, "memory": 1.1996421813964844, "total": 56.037092611}, {"workers": 2, "wall": 1.3054210461666664, "latency": 2.1145296475416666, "memory": 1.7995834350585938, "total": 31.330105107999994}, {"workers": 4, "wall": 0.8395234212500006, "latency": 2.4907003782916672, "memory": 3.1878128051757812, "total": 20.148562110000015}, {"workers": 6, "wall": 0.7179005195416667, "latency": 2.9696751314583345, "memory": 4.556674957275391, "total": 17.229612469}, {"workers": 8, "wall": 0.9757027639166675, "latency": 4.928531315166666, "memory": 5.678211212158203, "total": 23.41686633400002}];const labels={wall:'End-to-end wall time per completed match (seconds; lower is better)',latency:'Mean completed worker match latency (seconds)',memory:'Peak evaluator process-tree RSS (GiB)'};function draw(metric){const max=Math.max(...data.map(d=>d[metric]));document.getElementById('label').textContent=labels[metric];document.getElementById('chart').innerHTML=data.map(d=>`<div class="row ${d.workers===6?'best':''}" title="${d.workers} workers: ${d.total.toFixed(3)} seconds total"><span>${d.workers} worker${d.workers===1?'':'s'}</span><div class="track"><div class="bar" style="width:${d[metric]/max*100}%"></div></div><span class="value">${d[metric].toFixed(3)}</span></div>`).join('');document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.metric===metric));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.metric));draw('wall');</script></body></html>
