narrative:
- heading: Chapter development
  text: 'Alexis begins her investigation alone. A Darkness agent defeats her, Finn and Sirius intervene, and the
    Ténèbres absorb the defeated agent before questioning. Alexis then tells them the truth and accepts their help.


    A later lead produces the false conclusion that Atticus is irrecoverably lost, sending her into grief. Near
    the end of the chapter, the trio discovers him alive under the Ténèbres'' control and defeats him in a duel
    intended to liberate him.'
chapter: 'Chapter 1: one adult university year, approximately September–June; arc ordering remains provisional.'
