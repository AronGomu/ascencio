narrative:
- heading: Chapter development
  text: '1. Finn defeats Chaz after a public injustice, wounding his ego.

    2. A second public defeat destroys his rationalizations, status and follower relationships.

    3. Chaz withdraws, trains and returns for a result-flexible duel that he finally judges honestly.


    His transformation is from “I am superior, so I should not lose” to “I lost, so I must become better.” He remains
    proud, abrasive and ambitious.'
chapter: 'Chapter 1: one adult university year, approximately September–June; arc ordering remains provisional.'
