designBrief: Blaise is an adult woman with a slim silhouette and selected 40 cm bust circumference, a short ivory/pink-tinted
  bob with bangs, red eyes and a mischievous gentle expression. Her selected clip is the black blushing spider (round
  3 option 20), with ivory dot eyes, pink cheeks and a pink bow. No outfit has a spider pendant. Her casual outfit
  retains gothic web details; academic outfits are plain Red uniforms with no spider/web fashion motifs. The hair
  clip remains on all outfits.
