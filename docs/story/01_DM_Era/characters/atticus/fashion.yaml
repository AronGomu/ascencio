narrative:
- He wears the university uniform much more loosely than other students, with an open blazer or loose polo, relaxed
  collar, rolled sleeves and hands in pockets. This comes from temperament rather than status display.
- Under the Ténèbres' control, a mask covers all or part of his face or head. His clothing becomes entirely black
  and his silhouette rigid, closed and threatening. The exact mask and outfit remain undecided. The design must
  contrast his ordinary warmth with a dehumanized absence of openness.
