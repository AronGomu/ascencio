name: compatibility-and-browser-gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Restore immutable source and generated-asset caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream
            assets/content/card-library/data
            assets/content/card-library/images/full
            assets/content/card-library/images/cropped
            assets/content/card-library/images/card-back.jpg
            assets/content/card-library/images/sets
            generated
            !generated/build
            !generated/tests
          key: mvp-assets-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/**/*.ts', 'content/**/*.json', 'content/**/*.ydk', 'assets/content/**/authoring/**/*.json', 'image-content-lock.json', 'assets-source-lock.json') }}
          restore-keys: |
            mvp-assets-v2-${{ runner.os }}-

      - run: npm ci
      - name: Regenerate and verify the pinned snapshot
        run: npm run assets:mvp -- --concurrency 8 --requests-per-second 8
      - name: Acquire and verify pinned set images
        run: npm run assets:sets && npm run assets:sets:verify
      - name: Verify an isolated offline headless checkout
        shell: bash
        run: |
          isolated="$RUNNER_TEMP/ygo-story-duel-isolated"
          mkdir -p "$isolated"
          rsync -a --delete \
            --exclude .git \
            --exclude .agentsystem \
            --exclude .pi \
            --exclude node_modules \
            --exclude generated/build \
            --exclude generated/tests \
            ./ "$isolated/"
          cd "$isolated"
          npm ci --offline
          npm run check:headless
      - name: Install supported browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run protocol, asset, Worker, build, and browser gates
        run: npm run check

      - name: Archive verified private release candidate and revision manifests
        if: success() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: private-mvp-release-candidate-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            generated/build/app/
            generated/content-inputs/runtime/manifest.json
            vendor/ocgcore-wasm/0.1.2/vendor-manifest.json
            vendor/ocgcore-wasm/0.1.2/VENDORING.md

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            generated/tests/
            generated/**/*report*.json
            generated/mvp-assets-status.json
            generated/content-inputs/runtime/manifest.json
