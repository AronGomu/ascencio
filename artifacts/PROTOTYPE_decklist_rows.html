<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE decklist rows — copy-count placement (Variant A locked)</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#14161a; --panel:#1c1f25; --fg:#e8e9ec; --muted:#9aa0ab; --border:#2c313a;
    --row-h: 30px; --border-w: 5px; --art-fade: 38%; --art-opacity: 0.6; --tint-alpha: 0.2;
    --c-normal:#b8985a; --c-effect:#c26a3d; --c-ritual:#4a6fb5; --c-fusion:#8a63b0;
    --c-synchro:#c9c9c9; --c-xyz:#4a4a55; --c-link:#1d6ea8; --c-spell:#1d9e74; --c-trap:#bc5a84;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;}
  header.q{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted)}
  header.q b{color:var(--fg)}
  .stage{display:flex;justify-content:center;padding:24px 16px 120px}
  .panel{width:340px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;max-height:78vh;overflow:auto}
  h3{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h3:first-child{margin-top:0}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
  .row{position:relative;display:flex;align-items:center;height:var(--row-h);border-radius:5px;overflow:hidden;
       background:#22252c;border-left:var(--border-w) solid var(--fc);cursor:default}
  .art{position:absolute;inset:0;z-index:0;background-image:var(--img);background-size:cover;background-position:center 20%;opacity:var(--art-opacity)}
  .fade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#22252c 0%,#22252ccc var(--art-fade),#22252c00 100%)}
  .name{position:relative;z-index:2;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;
        text-shadow:0 1px 2px rgba(0,0,0,.8)}
  .row:hover{filter:brightness(1.15)}
  .cp{position:relative;z-index:2;flex:none}
  /* right-justified variants: cp hugs the right edge whatever the name length */
  .right .cp{margin-left:auto}

  /* V1 — pill badge, right edge */
  .v1 .cp{margin-right:6px;padding:1px 8px;border-radius:999px;background:#000c;border:1px solid color-mix(in srgb,var(--fc) 60%,transparent);
          color:color-mix(in srgb,var(--fc) 70%,#fff);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

  /* V2R — square token flush right */
  .v2R .cp{align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:26px;
          background:#000a;border-left:1px solid color-mix(in srgb,var(--fc) 55%,transparent);
          font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#e8e9ec}

  /* V2L1 — full-height dark cell, flush left after border */
  .v2L1 .cp{order:-1;align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:24px;
          background:#000a;
          font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:#e8e9ec}
  .v2L1 .name{padding-left:6px}
  /* reserve the cell even for singles so names align */
  .v2L1 .cp.empty{background:#0006}

  /* V2L2 — small frame-colored square badge left */
  .v2L2 .cp{order:-1;margin-left:6px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
          border-radius:4px;background:color-mix(in srgb,var(--fc) 80%,#000);
          color:#fff;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 1px 2px #000a}
  .v2L2 .cp.empty{visibility:hidden}
  .v2L2 .name{padding-left:6px}

  /* V2L3 — bare numeral + thin divider, fixed column so names align */
  .v2L3 .cp{order:-1;margin-left:6px;width:16px;text-align:center;
          border-right:1px solid color-mix(in srgb,var(--fc) 45%,transparent);padding-right:5px;
          color:color-mix(in srgb,var(--fc) 70%,#fff);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
          text-shadow:0 1px 2px #000}
  .v2L3 .cp.empty{border-right-color:color-mix(in srgb,var(--fc) 45%,transparent)}
  .v2L3 .name{padding-left:6px}

  /* V3 — diamond pips, right edge */
  .v3 .cp{margin-right:8px;display:flex;gap:3px}
  .v3 .pip{width:7px;height:7px;transform:rotate(45deg);background:color-mix(in srgb,var(--fc) 85%,#fff);
           box-shadow:0 0 3px #000;border-radius:1px}

  .switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#000a;border:1px solid var(--border);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px);z-index:50}
  .switch button{background:#2c313a;color:var(--fg);border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
  .switch .label{min-width:280px;text-align:center;font-size:13px}
</style>
</head>
<body>
<header class="q"><b>Question:</b> copy-count placement on approved Variant A row. Shortlist: pill / token / pips. Token gets 1 right + 3 left placements (left = after color border, before name). ←/→ cycles.</header>

<div class="stage"><div class="panel" id="panel"></div></div>

<div class="switch">
  <button id="prev">←</button>
  <div class="label" id="vlabel"></div>
  <button id="next">→</button>
</div>

<script>
const DECK = {"main": [{"code": 3717252, "name": "Shaddoll Beast", "frame": "effect"}, {"code": 3717252, "name": "Shaddoll Beast", "frame": "effect"}, {"code": 77723643, "name": "Shaddoll Dragon", "frame": "effect"}, {"code": 77723643, "name": "Shaddoll Dragon", "frame": "effect"}, {"code": 37445295, "name": "Shaddoll Falco", "frame": "effect"}, {"code": 37445295, "name": "Shaddoll Falco", "frame": "effect"}, {"code": 4939890, "name": "Shaddoll Hedgehog", "frame": "effect"}, {"code": 4939890, "name": "Shaddoll Hedgehog", "frame": "effect"}, {"code": 30328508, "name": "Shaddoll Squamata", "frame": "effect"}, {"code": 30328508, "name": "Shaddoll Squamata", "frame": "effect"}, {"code": 41386308, "name": "Mathematician", "frame": "effect"}, {"code": 41386308, "name": "Mathematician", "frame": "effect"}, {"code": 41386308, "name": "Mathematician", "frame": "effect"}, {"code": 85087012, "name": "Card Trooper", "frame": "effect"}, {"code": 85087012, "name": "Card Trooper", "frame": "effect"}, {"code": 23434538, "name": "Maxx \"C\"", "frame": "effect"}, {"code": 23434538, "name": "Maxx \"C\"", "frame": "effect"}, {"code": 97268402, "name": "Effect Veiler", "frame": "effect"}, {"code": 97268402, "name": "Effect Veiler", "frame": "effect"}, {"code": 44394295, "name": "Shaddoll Fusion", "frame": "spell"}, {"code": 44394295, "name": "Shaddoll Fusion", "frame": "spell"}, {"code": 44394295, "name": "Shaddoll Fusion", "frame": "spell"}, {"code": 48130397, "name": "Super Polymerization", "frame": "spell"}, {"code": 48130397, "name": "Super Polymerization", "frame": "spell"}, {"code": 81439173, "name": "Foolish Burial", "frame": "spell"}, {"code": 70368879, "name": "Upstart Goblin", "frame": "spell"}, {"code": 53129443, "name": "Dark Hole", "frame": "spell"}, {"code": 14087893, "name": "Book of Moon", "frame": "spell"}, {"code": 14087893, "name": "Book of Moon", "frame": "spell"}, {"code": 77505534, "name": "Sinister Shadow Games", "frame": "trap"}, {"code": 77505534, "name": "Sinister Shadow Games", "frame": "trap"}, {"code": 77505534, "name": "Sinister Shadow Games", "frame": "trap"}, {"code": 4904633, "name": "Shaddoll Core", "frame": "trap"}, {"code": 4904633, "name": "Shaddoll Core", "frame": "trap"}, {"code": 53582587, "name": "Torrential Tribute", "frame": "trap"}, {"code": 44095762, "name": "Mirror Force", "frame": "trap"}, {"code": 44095762, "name": "Mirror Force", "frame": "trap"}, {"code": 5851097, "name": "Vanity's Emptiness", "frame": "trap"}, {"code": 5851097, "name": "Vanity's Emptiness", "frame": "trap"}, {"code": 84749824, "name": "Solemn Warning", "frame": "trap"}], "extra": [{"code": 20366274, "name": "El Shaddoll Construct", "frame": "fusion"}, {"code": 20366274, "name": "El Shaddoll Construct", "frame": "fusion"}, {"code": 20366274, "name": "El Shaddoll Construct", "frame": "fusion"}, {"code": 94977269, "name": "El Shaddoll Winda", "frame": "fusion"}, {"code": 94977269, "name": "El Shaddoll Winda", "frame": "fusion"}, {"code": 94977269, "name": "El Shaddoll Winda", "frame": "fusion"}, {"code": 74822425, "name": "El Shaddoll Shekhinaga", "frame": "fusion"}, {"code": 74822425, "name": "El Shaddoll Shekhinaga", "frame": "fusion"}, {"code": 48424886, "name": "El Shaddoll Grysta", "frame": "fusion"}, {"code": 48424886, "name": "El Shaddoll Grysta", "frame": "fusion"}, {"code": 74009824, "name": "El Shaddoll Wendigo", "frame": "fusion"}, {"code": 74009824, "name": "El Shaddoll Wendigo", "frame": "fusion"}, {"code": 71594310, "name": "Gem-Knight Pearl", "frame": "xyz"}, {"code": 48739166, "name": "Number 101: Silent Honor ARK", "frame": "xyz"}, {"code": 21044178, "name": "Abyss Dweller", "frame": "xyz"}], "side": []};
const ART = c => `../generated/card-images/archive/cropped/${c}.jpg`;
const VARIANTS = {
  "1":  "1 — pill badge, right edge",
  "2R": "2R — square token, flush right",
  "2L1":"2L1 — full-height cell, left (all rows)",
  "2L2":"2L2 — colored square badge, left",
  "2L3":"2L3 — bare numeral + divider, left (all rows)",
  "3":  "3 — diamond pips, right edge"
};
const ORDER=Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get("variant") || "1";
if(!VARIANTS[variant]) variant = "1";

function grouped(rows){
  const out=[];
  for(const r of rows){
    const seen=out.find(e=>e.code===r.code);
    if(seen) seen.copies++;
    else out.push({...r,copies:1});
  }
  return out;
}
function copiesMarkup(n){
  const single = n<2;
  if(variant==="3") return single?"":`<span class="cp">${'<span class="pip"></span>'.repeat(n)}</span>`;
  if(variant==="1") return single?"":`<span class="cp">×${n}</span>`;
  if(variant==="2R") return single?"":`<span class="cp">${n}</span>`;
  /* left variants reserve the column on singles so card names line up */
  if(variant==="2L2") return `<span class="cp${single?' empty':''}">${single?"":n}</span>`;
  return `<span class="cp${single?' empty':''}">${single?"":n}</span>`;
}
function render(){
  const panel=document.getElementById("panel");
  const right = variant==="1"||variant==="2R"||variant==="3";
  panel.className="panel v"+variant+(right?" right":"");
  let html="";
  for(const [id,label] of [["main","Main"],["extra","Extra"],["side","Side"]]){
    if(!DECK[id].length) continue;
    html+=`<h3>${label} (${DECK[id].length})</h3><ul>`;
    for(const r of grouped(DECK[id])){
      html+=`<li class="row" style="--fc:var(--c-${r.frame});--img:url('${ART(r.code)}')">`+
        `<span class="art"></span><span class="fade"></span>`+
        `<span class="name">${r.name}</span>${copiesMarkup(r.copies)}</li>`;
    }
    html+="</ul>";
  }
  panel.innerHTML=html;
  document.getElementById("vlabel").textContent=VARIANTS[variant];
  const u=new URL(location); u.searchParams.set("variant",variant); history.replaceState(null,"",u);
}
function step(d){ variant=ORDER[(ORDER.indexOf(variant)+d+ORDER.length)%ORDER.length]; render(); }
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
addEventListener("keydown",e=>{
  const t=document.activeElement;
  if(t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable)) return;
  if(e.key==="ArrowLeft") step(-1);
  if(e.key==="ArrowRight") step(1);
});
render();
</script>
</body>
</html>
