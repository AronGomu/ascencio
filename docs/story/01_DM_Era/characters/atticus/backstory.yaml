timeline: []
narrative:
- heading: Disappearance
  text: 'Ascensio''s world has modern or slightly advanced internet and artificial-intelligence technology. Atticus
    finds occult archives, esoteric communities and digitized books online. His intuitive, experimental temperament
    leads him to try a ritual before understanding its consequences.


    He begins believing his mind can directly act on reality. That belief makes him receptive to the Ténèbres and
    attracts Darkness. Seeking enough power to defeat Zen, Atticus contacts the organization, loses a duel against
    its agents and is absorbed.


    His jealousy, impatience and search for a shortcut led him to Darkness, so he is not a wholly passive victim.
    After absorption, however, he becomes the prisoner of a force beyond him.'
