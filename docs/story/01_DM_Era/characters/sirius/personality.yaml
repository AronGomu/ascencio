narrative:
- heading: Personality
  text: 'Sirius is insecure, avoidant and curious. He avoids confrontation, delays difficult decisions, lets more
    capable people act and escapes situations exposing weakness. Unanswered questions bother him. He investigates
    people, decks and mysteries because he wants information, not automatically from courage or altruism.


    Sirius explores possibilities and understands systems. Alexis eliminates possibilities until she reaches the
    facts. He may accumulate information from pure curiosity; she prioritizes evidence that advances her investigation.'
