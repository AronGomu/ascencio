narrative:
- heading: Motivation
  text: '- Desire: become the best duelist in the world because he genuinely loves Duel Monsters.

    - Weakness: impulsiveness, lack of discipline and neglect of anything that does not interest him.

    - Need: understand that chosen effort in service of a value is not parental constraint.

    - Chapter development: begin taking responsibility for the work needed to reach his goal.


    What Finn calls egoism is whim-worship: following immediate impulse instead of rationally serving a long-term
    value. His laziness harms his own progress, not primarily other people.'
