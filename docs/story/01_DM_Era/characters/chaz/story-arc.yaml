developments:
- startingState: Identity depends on rank, recognition and presumed superiority.
  pressurePoint: Two public defeats destroy his rationalizations and cause his followers to leave.
  revelation: He had followers, not friends; honest examination of defeat is necessary.
  endState: Returns after training and accepts either result, still proud, competitive and abrasive.
  era: 01_DM_Era
  chapter: 1
