narrative:
- heading: Personality
  text: 'Atticus is pleasant, intuitive, playful, socially magnetic and naturally talented. He is athletic, relaxed
    and accustomed to people liking him. His growing pride remains mostly internal and does not immediately make
    him cruel.


    Repeated losses to Zen become intolerable because they prove that natural talent has a limit. Atticus does not
    openly hate Zen; he cannot accept that another duelist remains beyond him.'
