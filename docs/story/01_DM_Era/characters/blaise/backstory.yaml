familyAndOrigin: Blaise's parents initially prevented her from following Finn to Violet Academy because they opposed
  a duelist or conflict-profession path. She began another course of adult education, but separation from Finn made
  her increasingly unhappy. She eventually confronted her parents and changed direction.
