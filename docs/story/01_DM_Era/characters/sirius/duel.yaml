narrative:
- heading: Duel identity
  text: 'Sirius is not an exceptional pilot. Under pressure he hesitates, overthinks, makes avoidable mistakes and
    often sees the correct line too late. His talent is metagame understanding: deck building, card evaluation,
    matchup theory, statistics, prediction, analysis and identifying weaknesses.


    > Zen: Give me a deck and I''ll pilot it better than you.

    >

    > Sirius: Give me a format and I''ll understand it better than you.'
